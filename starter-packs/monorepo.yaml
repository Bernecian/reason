# .r/rules.yaml — generic pnpm / turbo monorepo starter pack

config:
  cache_ttl_ms: 60000

rules:
  - name: conventions
    match:
      keywords: [convention, commit, rule, workflow, style]
    load:
      - CLAUDE.md
    reason: Project conventions.

  - name: workspace-shape
    match:
      keywords: [workspace, package, app, turbo, pnpm]
    load:
      - pnpm-workspace.yaml
      - turbo.json
      - package.json
    reason: Workspace layout.

  - name: app-specific-readme
    match:
      paths: ["apps/**/*"]
    load:
      - "apps/*/CLAUDE.md"
      - "apps/*/README.md"
    reason: App-specific rules + README.

  - name: package-specific-readme
    match:
      paths: ["packages/**/*"]
    load:
      - "packages/*/README.md"
    reason: Shared-package READMEs.

